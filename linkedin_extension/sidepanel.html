<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 14px; background: #f4f2ee; margin: 0; color: #1d2226; }
    .header { text-align: center; background: #0a66c2; color: white; padding: 12px; border-radius: 8px; margin-bottom: 14px; }
    .header h3 { margin: 0; font-size: 16px; }
    .header p { margin: 4px 0 0 0; font-size: 11px; opacity: 0.9; }
    .card { background: white; padding: 12px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 12px; }
    label { font-weight: 600; font-size: 11px; color: #5e5e5e; text-transform: uppercase; display: block; margin-top: 8px; }
    select, input, textarea { width: 100%; margin-top: 4px; padding: 8px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 12px; }
    button { background: #0a66c2; color: white; font-weight: bold; border: none; margin-top: 10px; cursor: pointer; padding: 10px; border-radius: 20px; width: 100%; font-size: 13px; transition: background 0.2s; }
    button:hover { background: #004182; }
    .secondary-btn { background: #eef3f8; color: #0a66c2; border: 1px solid #0a66c2; margin-top: 6px; }
    .secondary-btn:hover { background: #dce6f1; }
    #output { background: white; padding: 12px; border-radius: 8px; border: 1px solid #e0e0e0; margin-top: 10px; min-height: 120px; max-height: 280px; overflow-y: auto; font-size: 12px; white-space: pre-wrap; line-height: 1.5; }
    .spinner { display: none; text-align: center; margin: 10px 0; font-size: 12px; color: #0a66c2; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <h3>🎓 LinkedIn Career Assistant</h3>
    <p>Student Profile & Resume Optimizer</p>
  </div>

  <div class="card">
    <label for="targetRole">Target Role:</label>
    <input type="text" id="targetRole" placeholder="e.g. Python Developer / Data Analyst">

    <label for="studentDegree">Degree / Major:</label>
    <input type="text" id="studentDegree" placeholder="e.g. B.Tech Computer Science (Final Year)">
  </div>

  <div class="card">
    <label for="taskSelect">Select AI Task:</label>
    <select id="taskSelect">
      <option value="2">1. Student Headline Generator</option>
      <option value="3">2. Write "About" Section</option>
      <option value="5">3. Convert Project to Resume/LinkedIn Bullets</option>
      <option value="4">4. Improve Experience / Bullet Points</option>
      <option value="9">5. Convert Resume to LinkedIn Profile</option>
      <option value="8">6. Match My Profile to a Job Description</option>
      <option value="7">7. Analyze Job Description</option>
      <option value="10">8. Recruiter Outreach / Cold Message</option>
      <option value="11">9. Connection Request (<300 chars)</option>
      <option value="12">10. Create 30/60/90-Day Career Roadmap</option>
      <option value="13">11. Prepare for Interview</option>
      <option value="1">12. Full LinkedIn Profile Analysis</option>
    </select>

    <label for="userInput">Details / Input Text:</label>
    <textarea id="userInput" rows="4" placeholder="Paste project details, resume text, or job description here..."></textarea>

    <button id="runBtn">Generate with AI</button>
  </div>

  <div class="spinner" id="loadingSpinner">⏳ Generating recommendations via Gemini...</div>

  <div class="card" style="margin-bottom:0;">
    <label>AI Recommendations:</label>
    <div id="output">Results will appear here...</div>
    <button id="copyBtn" class="secondary-btn">📋 Copy Result to Clipboard</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
